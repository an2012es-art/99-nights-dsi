
name: Build 99 Nights DSi

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nintendo DS libraries
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed nds-dev

      - name: Build game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          make

      - name: Upload NDS
        uses: actions/upload-artifact@v4
        with:
          name: 99NightsDSi
          path: 99NightsDSi.nds
          
