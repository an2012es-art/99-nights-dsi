
name: Build NDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -e
          T=$(find /opt/devkitpro/examples/nds -type d -name hello_world | head -1)
          test -n "$T"
          mkdir -p /tmp/proj
          cp -r "$T"/. /tmp/proj/
          rm -f /tmp/proj/source/*
          cp "$GITHUB_WORKSPACE/main.c" /tmp/proj/source/main.c
          cd /tmp/proj
          make
          cp ./*.nds "$GITHUB_WORKSPACE/minish_quest.nds"

      - uses: actions/upload-artifact@v4
        with:
          name: minish_quest
          path: minish_quest.nds
          
